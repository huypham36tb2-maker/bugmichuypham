<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bạch Long Minh Tool</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #000;
            color: #fff;
            min-height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Background particles canvas */
        #particles-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* Main content */
        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 400px;
            padding: 40px 20px;
            text-align: center;
        }

        /* Logo */
        .logo-container {
            margin-bottom: 25px;
        }

        .logo {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #a855f7, #7c3aed);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            color: #fff;
            margin: 0 auto 15px;
            box-shadow: 0 10px 30px rgba(168, 85, 247, 0.4);
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 10px;
            letter-spacing: 0.5px;
        }

        .subtitle {
            color: #9ca3af;
            font-size: 15px;
            margin-bottom: 40px;
        }

        /* Key input */
        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        .input-icon {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: #9ca3af;
        }

        .key-input {
            width: 100%;
            padding: 18px 20px 18px 50px;
            background: #1f1f1f;
            border: 1px solid #333;
            border-radius: 30px;
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: all 0.3s;
            font-family: 'Courier New', monospace;
            letter-spacing: 1px;
        }

        .key-input::placeholder {
            color: #6b7280;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            letter-spacing: normal;
        }

        .key-input:focus {
            border-color: #a855f7;
            box-shadow: 0 0 0 2px rgba(168, 85, 247, 0.2);
        }

        /* Button */
        .btn-submit {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #a855f7, #7c3aed);
            color: #fff;
            border: none;
            border-radius: 30px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 10px 30px rgba(168, 85, 247, 0.4);
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(168, 85, 247, 0.5);
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        .btn-submit:disabled {
            opacity: 0.7;
            transform: none;
        }

        /* Contact */
        .contact {
            margin-top: 30px;
            font-size: 14px;
            color: #9ca3af;
        }

        .contact a {
            color: #a855f7;
            text-decoration: none;
            font-weight: 500;
        }

        .contact a:hover {
            text-decoration: underline;
        }

        /* Hidden elements */
        .hidden {
            display: none !important;
        }

        /* Dashboard (after login) */
        .dashboard {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 500px;
            padding: 20px;
            text-align: center;
            display: none;
        }

        .dashboard.active {
            display: block;
        }

        .admin-panel {
            background: #1a1a1a;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #333;
        }

        .admin-title {
            font-size: 20px;
            color: #a855f7;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .admin-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        .btn-admin {
            padding: 10px 20px;
            background: #2d2d2d;
            border: 1px solid #444;
            color: #fff;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
        }

        .btn-admin:hover {
            background: #a855f7;
            border-color: #a855f7;
        }

        .btn-admin.danger {
            background: #ff4d4d;
        }

        .btn-admin.danger:hover {
            background: #ff3333;
        }

        /* Key management */
        .key-generator {
            background: #1a1a1a;
            border-radius: 15px;
            padding: 20px;
            margin: 15px 0;
            border: 1px solid #333;
            display: none;
        }

        .duration-btn {
            padding: 8px 20px;
            margin: 5px;
            background: #2d2d2d;
            border: 1px solid #444;
            color: #fff;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .duration-btn:hover,
        .duration-btn.active {
            background: #a855f7;
            border-color: #a855f7;
        }

        .generated-key-box {
            background: #2d2d2d;
            border-radius: 10px;
            padding: 15px;
            margin: 15px 0;
            font-family: 'Courier New', monospace;
            font-size: 18px;
            color: #a855f7;
            word-break: break-all;
        }

        /* Toast */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: #2d2d2d;
            color: #fff;
            padding: 15px 25px;
            border-radius: 30px;
            font-size: 14px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: transform 0.3s ease;
            z-index: 1000;
            border-left: 3px solid #a855f7;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        .toast.error {
            border-left-color: #ff4d4d;
        }

        /* Key list */
        .key-list-container {
            max-height: 300px;
            overflow-y: auto;
            margin-top: 15px;
        }

        .key-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #2d2d2d;
            padding: 10px;
            margin: 8px 0;
            border-radius: 10px;
        }

        .key-code {
            font-family: 'Courier New', monospace;
            color: #a855f7;
            font-weight: bold;
        }

        .key-info {
            font-size: 12px;
            color: #9ca3af;
        }

        .btn-delete {
            background: #ff4d4d;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 12px;
        }

        /* Video management */
        .video-input {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            background: #2d2d2d;
            border: 1px solid #444;
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <!-- Particle Network Background -->
    <canvas id="particles-canvas"></canvas>

    <!-- Login Screen -->
    <div class="container" id="loginScreen">
        <div class="logo-container">
            <div class="logo">BL</div>
            <h1>Bạch Long Minh</h1>
            <p class="subtitle">Nhập license key để tiếp tục</p>
        </div>

        <div class="input-group">
            <span class="input-icon">🔑</span>
            <input type="text" class="key-input" id="keyInput" placeholder="BL-XXXX-XXXX-XXXX-XXXX" autocomplete="off" spellcheck="false">
        </div>

        <button class="btn-submit" onclick="validateKey()">Xác nhận Key</button>

        <div class="contact">
            Liên hệ <a href="https://zalo.me" target="_blank">zalo/bachlongminh_01</a> để mua key
        </div>
    </div>

    <!-- Dashboard (after login) -->
    <div class="dashboard" id="dashboard">
        <div class="logo-container">
            <div class="logo">BL</div>
            <h1>Bạch Long Minh</h1>
        </div>

        <!-- Admin Panel -->
        <div class="admin-panel hidden" id="adminPanel">
            <div class="admin-title">👑 Quản Trị Viên</div>
            <div class="admin-buttons">
                <button class="btn-admin" onclick="showKeyGenerator()">🔑 Tạo Key</button>
                <button class="btn-admin" onclick="showKeyList()">📋 Danh Sách Key</button>
                <button class="btn-admin" onclick="showVideoManager()">🎬 Quản Lý Video</button>
                <button class="btn-admin danger" onclick="logout()">🚪 Đăng Xuất</button>
            </div>

            <!-- Key Generator -->
            <div class="key-generator" id="keyGenerator">
                <h3 style="color:#a855f7; margin-bottom:15px;">Tạo Key Mới</h3>
                <div style="margin-bottom:15px;">
                    <button class="duration-btn" onclick="setDuration('hour', this)">⏰ 1 Giờ</button>
                    <button class="duration-btn active" onclick="setDuration('day', this)">📅 1 Ngày</button>
                    <button class="duration-btn" onclick="setDuration('week', this)">📆 1 Tuần</button>
                    <button class="duration-btn" onclick="setDuration('month', this)">🗓️ 1 Tháng</button>
                </div>
                <button class="btn-admin" onclick="generateKey()">Tạo Key</button>
                <div class="generated-key-box hidden" id="generatedKeyBox"></div>
                <button class="btn-admin hidden" id="copyBtn" onclick="copyGeneratedKey()">📋 Sao Chép</button>
            </div>

            <!-- Key List -->
            <div class="key-generator" id="keyList">
                <h3 style="color:#a855f7; margin-bottom:15px;">Danh Sách Key</h3>
                <div class="key-list-container" id="keysListContainer"></div>
            </div>

            <!-- Video Manager -->
            <div class="key-generator" id="videoManager">
                <h3 style="color:#a855f7; margin-bottom:15px;">Quản Lý Video</h3>
                <input type="text" class="video-input" id="newVideoTitle" placeholder="Tên video">
                <input type="text" class="video-input" id="newVideoDesc" placeholder="Mô tả video">
                <input type="text" class="video-input" id="newVideoUrl" placeholder="URL video">
                <button class="btn-admin" onclick="addVideo()">➕ Thêm Video</button>
                <div class="key-list-container" id="videoListContainer"></div>
            </div>
        </div>

        <!-- Video Grid -->
        <div id="videoGrid" style="margin-top:20px;"></div>
    </div>

    <!-- Toast notification -->
    <div class="toast" id="toast"></div>

    <script>
        // Admin credentials
        const ADMIN_KEY = 'BL-ADMIN-2024';
        const ADMIN_ZALO = 'bachlongminh_01';

        // Data storage
        let userType = 'user';
        let selectedDuration = 'day';
        
        // Video data (initial)
        let videos = [
            { id: 1, title: 'Star Dance Video', description: 'Video biểu diễn âm nhạc sôi động', url: '#' },
            { id: 2, title: 'Star Wedding Video', description: 'Video đám cưới lãng mạn', url: '#' },
            { id: 3, title: 'Star Nature Video', description: 'Video thiên nhiên tuyệt đẹp', url: '#' }
        ];

        // Keys data
        let keys = [
            { code: 'BL-TEST-1234', duration: 'day', expiresAt: Date.now() + 86400000, used: false }
        ];

        // Particle Network Background
        const canvas = document.getElementById('particles-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        
        function createParticles() {
            particles = [];
            const count = Math.min(80, window.innerWidth / 15);
            
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    vx: (Math.random() - 0.5) * 0.5,
                    vy: (Math.random() - 0.5) * 0.5,
                    size: Math.random() * 2 + 1
                });
            }
        }
        
        createParticles();
        
        function drawParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw connecting lines
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    
                    if (distance < 150) {
                        ctx.beginPath();
                        ctx.strokeStyle = `rgba(168, 85, 247, ${1 - distance / 150})`;
                        ctx.lineWidth = 0.5;
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                    }
                }
            }
            
            // Draw particles
            particles.forEach(particle => {
                ctx.beginPath();
                ctx.arc(particle.x, particle.y, particle.size, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(168, 85, 247, 0.7)';
                ctx.fill();
                
                // Move particles
                particle.x += particle.vx;
                particle.y += particle.vy;
                
                // Wrap around edges
                if (particle.x < 0) particle.x = canvas.width;
                if (particle.x > canvas.width) particle.x = 0;
                if (particle.y < 0) particle.y = canvas.height;
                if (particle.y > canvas.height) particle.y = 0;
            });
        }
        
        function animateParticles() {
            drawParticles();
            requestAnimationFrame(animateParticles);
        }
        
        animateParticles();

        // Validate key function
        function validateKey() {
            const inputKey = document.getElementById('keyInput').value.trim().toUpperCase();
            
            if (!inputKey) {
                showToast('Vui lòng nhập key!', true);
                return;
            }
            
            if (inputKey === ADMIN_KEY) {
                userType = 'admin';
                loginSuccess();
                showToast('👑 Xin chào Admin!');
                return;
            }
            
            // Check regular keys
            const key = keys.find(k => k.code === inputKey);
            if (key) {
                if (key.used) {
                    showToast('Key đã được sử dụng!', true);
                    return;
                }
                if (Date.now() > key.expiresAt) {
                    showToast('Key đã hết hạn!', true);
                    return;
                }
                
                key.used = true;
                userType = 'user';
                loginSuccess();
                showToast('✅ Đăng nhập thành công!');
            } else {
                showToast('Key không hợp lệ!', true);
            }
        }

        // Login success
        function loginSuccess() {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('dashboard').classList.add('active');
            
            if (userType === 'admin') {
                document.getElementById('adminPanel').classList.remove('hidden');
            }
            
            loadVideos();
        }

        // Logout
        function logout() {
            document.getElementById('dashboard').classList.remove('active');
            document.getElementById('loginScreen').style.display = 'block';
            document.getElementById('keyInput').value = '';
            document.getElementById('adminPanel').classList.add('hidden');
            showToast('Đã đăng xuất!');
        }

        // Set duration
        function setDuration(duration, btn) {
            selectedDuration = duration;
            document.querySelectorAll('.duration-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        // Generate key
        function generateKey() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let code = 'BL-';
            
            for (let i = 0; i < 12; i++) {
                if (i > 0 && i % 4 === 0) code += '-';
                code += chars[Math.floor(Math.random() * chars.length)];
            }
            
            let durationMs;
            switch(selectedDuration) {
                case 'hour': durationMs = 3600000; break;
                case 'day': durationMs = 86400000; break;
                case 'week': durationMs = 604800000; break;
                case 'month': durationMs = 2592000000; break;
            }
            
            const newKey = {
                code: code,
                duration: selectedDuration,
                expiresAt: Date.now() + durationMs,
                used: false
            };
            
            keys.push(newKey);
            
            // Show generated key
            const box = document.getElementById('generatedKeyBox');
            box.classList.remove('hidden');
            box.textContent = code;
            
            document.getElementById('copyBtn').classList.remove('hidden');
            showToast('✅ Key đã tạo thành công!');
        }

        // Copy key
        function copyGeneratedKey() {
            const code = document.getElementById('generatedKeyBox').textContent;
            navigator.clipboard.writeText(code);
            showToast('📋 Đã sao chép key!');
        }

        // Show key generator
        function showKeyGenerator() {
            hideAllPanels();
            document.getElementById('keyGenerator').style.display = 'block';
        }

        // Show key list
        function showKeyList() {
            hideAllPanels();
            document.getElementById('keyList').style.display = 'block';
            renderKeyList();
        }

        // Show video manager
        function showVideoManager() {
            hideAllPanels();
            document.getElementById('videoManager').style.display = 'block';
            renderVideoList();
        }

        // Hide all panels
        function hideAllPanels() {
            document.getElementById('keyGenerator').style.display = 'none';
            document.getElementById('keyList').style.display = 'none';
            document.getElementById('videoManager').style.display = 'none';
        }

        // Render key list
        function renderKeyList() {
            const container = document.getElementById('keysListContainer');
            container.innerHTML = '';
            
            keys.forEach((key, index) => {
                const item = document.createElement('div');
                item.className = 'key-item';
                
                const info = document.createElement('div');
                info.innerHTML = `
                    <div class="key-code">${key.code}</div>
                    <div class="key-info">${key.used ? 'Đã dùng' : 'Chưa dùng'} | Hết hạn: ${new Date(key.expiresAt).toLocaleDateString('vi-VN')}</div>
                `;
                
                const btn = document.createElement('button');
                btn.className = 'btn-delete';
                btn.textContent = '🗑️';
                btn.onclick = () => deleteKey(index);
                
                item.appendChild(info);
                item.appendChild(btn);
                container.appendChild(item);
            });
        }

        // Delete key
        function deleteKey(index) {
            if (confirm('Xóa key này?')) {
                keys.splice(index, 1);
                renderKeyList();
                showToast('Đã xóa key!');
            }
        }

        // Add video
        function addVideo() {
            const title = document.getElementById('newVideoTitle').value;
            const desc = document.getElementById('newVideoDesc').value;
            const url = document.getElementById('newVideoUrl').value;
            
            if (!title || !desc || !url) {
                showToast('Vui lòng nhập đầy đủ!', true);
                return;
            }
            
            videos.push({ id: Date.now(), title, description: desc, url });
            
            document.getElementById('newVideoTitle').value = '';
            document.getElementById('newVideoDesc').value = '';
            document.getElementById('newVideoUrl').value = '';
            
            renderVideoList();
            loadVideos();
            showToast('✅ Đã thêm video!');
        }

        // Render video list
        function renderVideoList() {
            const container = document.getElementById('videoListContainer');
            container.innerHTML = '';
            
            videos.forEach((video, index) => {
                const item = document.createElement('div');
                item.className = 'key-item';
                
                const info = document.createElement('div');
                info.innerHTML = `<div class="key-code">${video.title}</div><div class="key-info">${video.description}</div>`;
                
                const btn = document.createElement('button');
                btn.className = 'btn-delete';
                btn.textContent = '🗑️';
                btn.onclick = () => deleteVideo(index);
                
                item.appendChild(info);
                item.appendChild(btn);
                container.appendChild(item);
            });
        }

        // Delete video
        function deleteVideo(index) {
            if (confirm('Xóa video này?')) {
                videos.splice(index, 1);
                renderVideoList();
                loadVideos();
                showToast('Đã xóa video!');
            }
        }

        // Load videos to grid
        function loadVideos() {
            const grid = document.getElementById('videoGrid');
            grid.innerHTML = '';
            
            videos.forEach(video => {
                const card = document.createElement('div');
                card.style.cssText = 'background:#1a1a1a; border-radius:15px; padding:20px; margin:15px 0; border:1px solid #333;';
                card.innerHTML = `
                    <div style="background:linear-gradient(45deg,#a855f7,#7c3aed); height:120px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:40px; margin-bottom:15px;">🎬</div>
                    <h3 style="color:#fff; margin-bottom:10px;">${video.title}</h3>
                    <p style="color:#9ca3af; font-size:14px; margin-bottom:15px;">${video.description}</p>
                    <button class="btn-submit" style="width:100%;" onclick="showToast('Đang tải video...')">📥 Nhận Video</button>
                `;
                grid.appendChild(card);
            });
        }

        // Show toast
        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast show' + (isError ? ' error' : '');
            
            setTimeout(() => {
                toast.className = 'toast';
            }, 3000);
        }
    </script>
</body>
</html>
