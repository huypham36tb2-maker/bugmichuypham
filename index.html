<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bạch Long Minh Tool</title>
    <!-- Thư viện QR Code -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: #000; color: #fff; min-height: 100vh; overflow-x: hidden; display: flex; flex-direction: column; align-items: center; position: relative; }
        
        #particles-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
        
        .main-wrapper { position: relative; z-index: 1; width: 100%; max-width: 500px; padding: 20px; text-align: center; }
        
        .logo-container { margin-top: 20px; margin-bottom: 15px; }
        .logo { width: 60px; height: 60px; background: linear-gradient(135deg, #a855f7, #7c3aed); border-radius: 15px; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: bold; color: #fff; margin: 0 auto 10px; }
        h1 { font-size: 24px; font-weight: 700; color: #fff; margin-bottom: 5px; }
        .subtitle { color: #9ca3af; font-size: 14px; margin-bottom: 15px; }

        /* Video Preview */
        .video-preview-box {
            background: #1a1a1a; border: 1px solid #333; border-radius: 12px; overflow: hidden; margin-bottom: 15px;
        }
        .video-preview-content { height: 220px; background: #000; position: relative; }
        .video-preview-content video { width: 100%; height: 100%; object-fit: contain; }
        
        .video-preview-label {
            position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); 
            color: #fff; padding: 5px 10px; border-radius: 15px; font-size: 12px;
        }

        /* Key Entry */
        .key-section { background: rgba(30, 30, 30, 0.9); border-radius: 15px; padding: 15px; border: 1px solid #333; }
        .key-label { font-size: 16px; color: #fff; margin-bottom: 10px; font-weight: 600; }
        
        .input-group { position: relative; margin-bottom: 10px; }
        .input-icon { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #9ca3af; font-size: 18px; }
        .key-input { width: 100%; padding: 15px 45px; background: #1f1f1f; border: 1px solid #444; border-radius: 25px; color: #fff; font-size: 15px; outline: none; font-family: 'Courier New', monospace; letter-spacing: 1px; text-transform: uppercase; }
        .key-input::placeholder { color: #6b7280; font-family: -apple-system, sans-serif; letter-spacing: normal; text-transform: none; font-size: 14px; }

        .btn-icon {
            position: absolute; top: 50%; transform: translateY(-50%); background: #333; border: none; color: #fff; width: 35px; height: 35px; border-radius: 50%; cursor: pointer; font-size: 15px; display: flex; align-items: center; justify-content: center;
        }
        .paste-btn { right: 10px; }
        .btn-icon:active { background: #a855f7; }

        .btn-submit { width: 100%; padding: 15px; background: linear-gradient(135deg, #a855f7, #7c3aed); color: #fff; border: none; border-radius: 25px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 10px; }
        .btn-submit:active { transform: scale(0.97); }

        .contact { margin-top: 15px; font-size: 13px; color: #9ca3af; }
        .contact a { color: #a855f7; text-decoration: none; font-weight: 500; }
        .buy-btn { background: linear-gradient(135deg, #f093fb, #f5576c); color: #fff; padding: 8px 15px; border: none; border-radius: 20px; cursor: pointer; font-weight: bold; margin-top: 10px; font-size: 14px; }

        /* Dashboard */
        .dashboard { display: none; width: 100%; max-width: 600px; padding: 20px; text-align: center; }
        .dashboard.active { display: block; }
        
        .timer-box { background: #1a1a1a; border-radius: 12px; padding: 12px; margin-bottom: 15px; border: 1px solid #444; font-size: 14px; }
        .timer-text { font-size: 20px; font-weight: bold; color: #a855f7; }
        
        .admin-panel { background: #1a1a1a; border-radius: 12px; padding: 15px; margin-bottom: 15px; border: 1px solid #333; display: none; }
        .admin-panel.active { display: block; }
        .admin-title { font-size: 18px; color: #a855f7; margin-bottom: 10px; font-weight: 600; }
        .admin-buttons { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
        .btn-admin { padding: 8px 15px; background: #2d2d2d; border: 1px solid #444; color: #fff; border-radius: 20px; cursor: pointer; font-size: 13px; }
        .btn-admin:active { background: #a855f7; }

        .key-generator { background: #1a1a1a; border-radius: 12px; padding: 15px; margin: 10px 0; border: 1px solid #333; display: none; }
        .key-generator.active { display: block; }
        
        .duration-btn { padding: 6px 12px; margin: 3px; background: #2d2d2d; border: 1px solid #444; color: #fff; border-radius: 15px; cursor: pointer; font-size: 12px; }
        .duration-btn.active { background: #a855f7; border-color: #a855f7; }
        
        .generated-key-box { background: #2d2d2d; border-radius: 8px; padding: 12px; margin: 10px 0; font-family: 'Courier New', monospace; font-size: 16px; color: #a855f7; word-break: break-all; }
        .qr-box { background: #fff; border-radius: 8px; padding: 8px; display: inline-block; margin: 10px auto; }
        
        .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px); background: #333; color: #fff; padding: 12px 20px; border-radius: 25px; font-size: 14px; transition: transform 0.3s ease; z-index: 1000; border: 1px solid #444; }
        .toast.show { transform: translateX(-50%) translateY(0); }
        .toast.error { border-color: #ff4d4d; color: #ff6b6b; }
        
        .key-list-container { max-height: 250px; overflow-y: auto; margin-top: 10px; }
        .key-item { display: flex; justify-content: space-between; align-items: center; background: #2d2d2d; padding: 8px; margin: 5px 0; border-radius: 8px; gap: 5px; }
        .key-code { font-family: 'Courier New', monospace; color: #a855f7; font-weight: bold; font-size: 13px; }
        .key-info { font-size: 11px; color: #9ca3af; }
        .btn-delete { background: #ff4d4d; color: white; border: none; padding: 4px 8px; border-radius: 8px; cursor: pointer; font-size: 11px; }
        .btn-lock { background: #ff9800; color: white; border: none; padding: 4px 8px; border-radius: 8px; cursor: pointer; font-size: 11px; }
        
        .video-input { width: 100%; padding: 10px; margin: 5px 0; background: #2d2d2d; border: 1px solid #444; border-radius: 8px; color: #fff; font-size: 13px; }
        .upload-area { border: 2px dashed #444; border-radius: 8px; padding: 15px; margin: 8px 0; cursor: pointer; text-align: center; font-size: 13px; }
        .sample-btn { background: #333; padding: 6px; margin: 3px; border-radius: 8px; cursor: pointer; font-size: 12px; border: 1px solid #555; }
        
        .video-card { background: #1a1a1a; border-radius: 12px; padding: 12px; margin: 10px 0; border: 1px solid #333; text-align: left; }
        .video-title { font-weight: bold; color: #fff; margin-bottom: 5px; font-size: 15px; }
        .video-desc { color: #9ca3af; font-size: 12px; margin-bottom: 8px; }
        .video-cat { font-size: 11px; color: #a855f7; background: #2d2d2d; padding: 2px 6px; border-radius: 8px; display: inline-block; margin-bottom: 8px; }
        .vip-badge { font-size: 11px; color: gold; background: #333; padding: 2px 6px; border-radius: 8px; margin-left: 5px; }
    </style>
</head>
<body>

    <canvas id="particles-canvas"></canvas>

    <!-- Màn hình chính -->
    <div class="main-wrapper" id="loginScreen">
        <div class="logo-container">
            <div class="logo">BL</div>
            <h1>Bạch Long Minh</h1>
            <p class="subtitle">Công cụ giải trí & chia sẻ video</p>
        </div>

        <!-- Video Preview thật từ link Discord -->
        <div class="video-preview-box">
            <div class="video-preview-content">
                <span class="video-preview-label">🎬 Preview</span>
                <video controls autoplay muted loop>
                    <source src="https://cdn.discordapp.com/attachments/1546217198593253396/1546303456879448115/1ef373c2861e4bdc8dce7f8f44325571.mov?ex=6a9ff391&is=6a9ea211&hm=68267fd4e9081815c8d70c13ccdfad7d4cf2e5b134f02b2b4724ff614a730bd0&" type="video/quicktime">
                    Trình duyệt của bạn không hỗ trợ video.
                </video>
            </div>
        </div>

        <div class="key-section">
            <div class="key-label">🔑 Nhập License Key</div>
            
            <div class="input-group">
                <span class="input-icon">🔑</span>
                <input type="text" class="key-input" id="keyInput" placeholder="BL-XXXX-XXXX-XXXX-XXXX" autocomplete="off" spellcheck="false">
                <button class="btn-icon paste-btn" onclick="pasteKey()">📋</button>
            </div>

            <button class="btn-submit" id="loginBtn" onclick="validateKey()">Xác nhận Key</button>
            
            <div style="margin-top: 15px;">
                <a href="tel:927594723" class="buy-btn">📞 Gọi mua key: 9275 9472 3</a>
            </div>

            <div class="contact">
                Liên hệ Zalo: <a href="https://zalo.me/927594723" target="_blank">9275 9472 3</a>
            </div>
        </div>
    </div>

    <!-- Dashboard -->
    <div class="dashboard" id="dashboard">
        <div class="logo-container">
            <div class="logo">BL</div>
            <h1>Bạch Long Minh</h1>
        </div>

        <div class="timer-box hidden" id="timerBox">
            ⏳ Key hết hạn sau: <span class="timer-text" id="timerDisplay">00:00:00</span>
        </div>

        <div class="admin-panel" id="adminPanel">
            <div class="admin-title">👑 Quản Trị Viên</div>
            <div class="admin-buttons">
                <button class="btn-admin" onclick="showKeyGenerator()">🔑 Tạo Key</button>
                <button class="btn-admin" onclick="showKeyList()">📋 DS Key</button>
                <button class="btn-admin" onclick="showVideoManager()">🎬 Quản Lý Video</button>
                <button class="btn-admin" onclick="logout()">🚪 Đăng Xuất</button>
            </div>

            <div class="key-generator" id="keyGenerator">
                <h3 style="color:#a855f7; font-size:16px; margin-bottom:10px;">Tạo Key Mới</h3>
                <div style="margin-bottom:10px;">
                    <button class="duration-btn" onclick="setDuration('hour', this)">⏰ 1 Giờ</button>
                    <button class="duration-btn active" onclick="setDuration('day', this)">📅 1 Ngày</button>
                    <button class="duration-btn" onclick="setDuration('week', this)">📆 1 Tuần</button>
                    <button class="duration-btn" onclick="setDuration('month', this)">🗓️ 1 Tháng</button>
                    <button class="duration-btn" onclick="setDuration('vip', this)">👑 VIP</button>
                </div>
                <input type="text" class="video-input" id="keyNote" placeholder="Ghi chú (VD: Tên khách)">
                <button class="btn-admin" onclick="generateKey()" style="width:100%; margin-top:5px;">Tạo Key</button>
                <div class="generated-key-box hidden" id="generatedKeyBox"></div>
                <div class="qr-box hidden" id="qrBox"></div>
                <button class="btn-admin hidden" id="copyBtn" onclick="copyGeneratedKey()" style="width:100%;">📋 Sao Chép</button>
            </div>

            <div class="key-generator" id="keyList">
                <h3 style="color:#a855f7; font-size:16px; margin-bottom:10px;">Danh Sách Key</h3>
                <div class="key-list-container" id="keysListContainer"></div>
            </div>

            <div class="key-generator" id="videoManager">
                <h3 style="color:#a855f7; font-size:16px; margin-bottom:10px;">Thêm Video Mới</h3>
                <input type="text" class="video-input" id="newVideoTitle" placeholder="Tên video">
                <input type="text" class="video-input" id="newVideoDesc" placeholder="Mô tả video">
                <select class="video-input" id="newVideoCat">
                    <option value="Star">Video Star</option>
                    <option value="Dance">Video Dance</option>
                    <option value="Wedding">Video Wedding</option>
                    <option value="Nature">Video Thiên Nhiên</option>
                </select>
                <div style="margin-bottom:5px; font-size:13px;">
                    <strong>Hoặc chọn Video mẫu:</strong><br>
                    <button class="sample-btn" onclick="pickSampleVideo(1)">Video Discord</button>
                    <button class="sample-btn" onclick="pickSampleVideo(2)">Mẫu 2</button>
                    <button class="sample-btn" onclick="pickSampleVideo(3)">Mẫu 3</button>
                </div>
                <div class="upload-area" onclick="document.getElementById('videoUpload').click()">
                    <input type="file" id="videoUpload" accept="video/*" hidden onchange="handleUpload(event)">
                    📤 Nhấp để Tải Video từ máy lên
                </div>
                <button class="btn-admin" onclick="addVideo()" style="width:100%; margin-top:5px;">➕ Thêm Video</button>
                <div class="key-list-container" id="videoListContainer"></div>
            </div>
        </div>

        <div id="videoGrid"></div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // ========== DATA ==========
        const ADMIN_KEY = 'BL-ADMIN-2024';
        const ADMIN_PHONE = '9275 9472 3';

        // Video Discord bạn cung cấp
        const discordVideoUrl = "https://cdn.discordapp.com/attachments/1546217198593253396/1546303456879448115/1ef373c2861e4bdc8dce7f8f44325571.mov?ex=6a9ff391&is=6a9ea211&hm=68267fd4e9081815c8d70c13ccdfad7d4cf2e5b134f02b2b4724ff614a730bd0&";

        const sampleVideos = [
            { id: 1, title: 'Video Discord', desc: 'Video từ Discord', cat: 'Star', url: discordVideoUrl },
            { id: 2, title: 'Star Dance Video', desc: 'Video nhảy sôi động', cat: 'Dance', url: 'https://www.w3schools.com/html/mov_bbb.mp4' },
            { id: 3, title: 'Star Nature Video', desc: 'Video thiên nhiên tuyệt đẹp', cat: 'Nature', url: 'https://www.w3schools.com/html/mov_bbb.mp4' }
        ];

        let videos = JSON.parse(localStorage.getItem('videos')) || sampleVideos.map(v => ({...v, isVip: false, thumb: ''}));
        let keys = JSON.parse(localStorage.getItem('keys')) || [
            { code: 'BL-DEMO-1234', duration: 'day', expiresAt: Date.now() + 86400000, used: false, locked: false, note: 'Key demo' }
        ];

        function saveData() {
            try { localStorage.setItem('videos', JSON.stringify(videos)); } catch(e) {}
            try { localStorage.setItem('keys', JSON.stringify(keys)); } catch(e) {}
        }

        // ========== PARTICLE ==========
        const canvas = document.getElementById('particles-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeCanvas); resizeCanvas();
        
        function createParticles() {
            particles = [];
            const count = Math.min(50, window.innerWidth / 20);
            for (let i = 0; i < count; i++) {
                particles.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, vx: (Math.random() - 0.5) * 0.4, vy: (Math.random() - 0.5) * 0.4, size: Math.random() * 2 + 1 });
            }
        }
        createParticles();
        
        function drawParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    if (distance < 130) {
                        ctx.beginPath(); ctx.strokeStyle = `rgba(168, 85, 247, ${1 - distance / 130})`; ctx.lineWidth = 0.5;
                        ctx.moveTo(particles[i].x, particles[i].y); ctx.lineTo(particles[j].x, particles[j].y); ctx.stroke();
                    }
                }
            }
            particles.forEach(particle => {
                ctx.beginPath(); ctx.arc(particle.x, particle.y, particle.size, 0, Math.PI * 2); ctx.fillStyle = 'rgba(168, 85, 247, 0.7)'; ctx.fill();
                particle.x += particle.vx; particle.y += particle.vy;
                if (particle.x < 0) particle.x = canvas.width;
                if (particle.x > canvas.width) particle.x = 0;
                if (particle.y < 0) particle.y = canvas.height;
                if (particle.y > canvas.height) particle.y = 0;
            });
        }
        function animateParticles() { drawParticles(); requestAnimationFrame(animateParticles); }
        animateParticles();

        // ========== HÀM DÁN KEY ==========
        function pasteKey() {
            if (navigator.clipboard && navigator.clipboard.readText) {
                navigator.clipboard.readText().then(text => {
                    document.getElementById('keyInput').value = text.trim().toUpperCase();
                    showToast('📋 Đã dán key!');
                }).catch(() => {
                    let text = prompt('Dán key vào đây:');
                    if (text) document.getElementById('keyInput').value = text.trim().toUpperCase();
                });
            } else {
                let text = prompt('Dán key vào đây:');
                if (text) document.getElementById('keyInput').value = text.trim().toUpperCase();
            }
        }

        // ========== ĐĂNG NHẬP ==========
        let loginAttempts = JSON.parse(localStorage.getItem('loginAttempts')) || { count: 0, time: 0 };
        
        function validateKey() {
            const inputKey = document.getElementById('keyInput').value.trim().toUpperCase();
            const btn = document.getElementById('loginBtn');
            
            if (!inputKey) { showToast('Vui lòng nhập key!', true); return; }

            btn.classList.add('loading');
            btn.disabled = true;

            setTimeout(() => {
                btn.classList.remove('loading');
                btn.disabled = false;

                if (inputKey === ADMIN_KEY) {
                    loginSuccess('admin');
                    showToast('👑 Xin chào Admin!');
                    return;
                }

                const key = keys.find(k => k.code === inputKey);
                if (key) {
                    if (key.locked) { showToast('🔒 Key đã bị khóa!', true); return; }
                    if (key.used) { showToast('Key đã được sử dụng!', true); return; }
                    if (Date.now() > key.expiresAt) { showToast('Key đã hết hạn!', true); return; }

                    key.used = true;
                    saveData();
                    loginSuccess('user', key);
                    showToast('✅ Đăng nhập thành công!');
                } else {
                    loginAttempts.count++;
                    loginAttempts.time = Date.now();
                    localStorage.setItem('loginAttempts', JSON.stringify(loginAttempts));
                    showToast(`Key không hợp lệ!`, true);
                }
            }, 800);
        }

        function loginSuccess(type, keyData = null) {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('dashboard').classList.add('active');
            
            if (type === 'admin') {
                document.getElementById('adminPanel').classList.add('active');
                loadVideos();
            } else {
                document.getElementById('timerBox').classList.remove('hidden');
                startTimer(keyData.expiresAt);
                loadVideos();
            }
        }

        // ========== TIMER ==========
        let timerInterval;
        function startTimer(expiresAt) {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                const now = Date.now();
                const diff = expiresAt - now;
                if (diff <= 0) {
                    clearInterval(timerInterval);
                    showToast('⏰ Key của bạn đã hết hạn!', true);
                    logout();
                    return;
                }
                const hours = Math.floor(diff / 3600000);
                const mins = Math.floor((diff % 3600000) / 60000);
                const secs = Math.floor((diff % 60000) / 1000);
                document.getElementById('timerDisplay').textContent = 
                    `${String(hours).padStart(2,'0')}:${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
            }, 1000);
        }

        // ========== LOGOUT ==========
        function logout() {
            clearInterval(timerInterval);
            document.getElementById('dashboard').classList.remove('active');
            document.getElementById('loginScreen').style.display = 'block';
            document.getElementById('keyInput').value = '';
            document.getElementById('adminPanel').classList.remove('active');
            document.getElementById('timerBox').classList.add('hidden');
        }

        // ========== ADMIN ==========
        let selectedDuration = 'day';
        function setDuration(duration, btn) {
            selectedDuration = duration;
            document.querySelectorAll('.duration-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        function generateKey() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let code = 'BL-';
            for (let i = 0; i < 12; i++) {
                if (i > 0 && i % 4 === 0) code += '-';
                code += chars[Math.floor(Math.random() * chars.length)];
            }
            
            let durationMs;
            switch(selectedDuration) {
                case 'hour': durationMs = 3600000; break;
                case 'day': durationMs = 86400000; break;
                case 'week': durationMs = 604800000; break;
                case 'month': durationMs = 2592000000; break;
                case 'vip': durationMs = Infinity; break;
            }
            
            const note = document.getElementById('keyNote').value || 'Không ghi chú';
            const newKey = { code, duration: selectedDuration, expiresAt: durationMs === Infinity ? Infinity : Date.now() + durationMs, used: false, locked: false, note };
            
            keys.push(newKey);
            saveData();
            
            const box = document.getElementById('generatedKeyBox');
            box.classList.remove('hidden');
            box.textContent = code;
            
            const qrBox = document.getElementById('qrBox');
            qrBox.classList.remove('hidden');
            qrBox.innerHTML = '';
            new QRCode(qrBox, code);
            
            document.getElementById('copyBtn').classList.remove('hidden');
            showToast('✅ Key đã tạo!');
        }

        function copyText(text) {
            try {
                const tempInput = document.createElement('input');
                tempInput.value = text;
                document.body.appendChild(tempInput);
                tempInput.select();
                document.execCommand('copy');
                document.body.removeChild(tempInput);
                showToast('📋 Đã sao chép!');
            } catch(e) {
                showToast('⚠️ Không thể sao chép!', true);
            }
        }

        function copyGeneratedKey() {
            const code = document.getElementById('generatedKeyBox').textContent;
            copyText(code);
        }

        function showKeyGenerator() { hideAllPanels(); document.getElementById('keyGenerator').classList.add('active'); }
        function showKeyList() { hideAllPanels(); document.getElementById('keyList').classList.add('active'); renderKeyList(); }
        function showVideoManager() { hideAllPanels(); document.getElementById('videoManager').classList.add('active'); renderVideoList(); }
        function hideAllPanels() { document.querySelectorAll('.key-generator').forEach(el => el.classList.remove('active')); }

        function renderKeyList() {
            const container = document.getElementById('keysListContainer');
            container.innerHTML = '';
            keys.forEach((key, index) => {
                const item = document.createElement('div');
                item.className = 'key-item';
                const status = key.locked ? 'Bị khóa' : (key.used ? 'Đã dùng' : 'Hoạt động');
                item.innerHTML = `
                    <div>
                        <div class="key-code">${key.code}</div>
                        <div class="key-info">${key.duration === 'vip' ? '👑 VIP' : key.duration} | ${status}</div>
                    </div>
                    <div>
                        <button class="btn-lock" onclick="toggleLock(${index})">${key.locked ? '🔓' : '🔒'}</button>
                        <button class="btn-delete" onclick="deleteKey(${index})">🗑️</button>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        function toggleLock(index) {
            keys[index].locked = !keys[index].locked;
            saveData(); renderKeyList();
            showToast(keys[index].locked ? '🔒 Đã khóa!' : '🔓 Đã mở khóa!');
        }

        function deleteKey(index) {
            if (confirm('Xóa key này?')) {
                keys.splice(index, 1);
                saveData(); renderKeyList();
                showToast('Đã xóa key!');
            }
        }

        // ========== VIDEO ==========
        function pickSampleVideo(id) {
            const v = sampleVideos.find(v => v.id === id);
            document.getElementById('newVideoTitle').value = v.title;
            document.getElementById('newVideoDesc').value = v.desc;
            document.getElementById('newVideoCat').value = v.cat;
            window.selectedSampleUrl = v.url;
        }

        function handleUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('newVideoTitle').value = file.name.replace(/\.[^/.]+$/, "");
                    document.getElementById('newVideoDesc').value = "Video tải lên bởi Admin";
                    window.uploadedVideoUrl = e.target.result;
                    showToast('📤 Đã chọn file!');
                };
                reader.readAsDataURL(file);
            }
        }

        function addVideo() {
            const title = document.getElementById('newVideoTitle').value;
            const desc = document.getElementById('newVideoDesc').value;
            const cat = document.getElementById('newVideoCat').value;
            const url = window.uploadedVideoUrl || window.selectedSampleUrl || '#';
            
            if (!title) { showToast('Vui lòng nhập tên!', true); return; }
            
            videos.push({ id: Date.now(), title, description: desc, cat, url });
            window.uploadedVideoUrl = null;
            window.selectedSampleUrl = null;
            
            document.getElementById('newVideoTitle').value = '';
            document.getElementById('newVideoDesc').value = '';
            
            saveData(); renderVideoList(); loadVideos();
            showToast('✅ Đã thêm video!');
        }

        function renderVideoList() {
            const container = document.getElementById('videoListContainer');
            container.innerHTML = '';
            videos.forEach((video, index) => {
                const item = document.createElement('div');
                item.className = 'key-item';
                item.innerHTML = `<div><div class="key-code">${video.title}</div></div><button class="btn-delete" onclick="deleteVideo(${index})">🗑️</button>`;
                container.appendChild(item);
            });
        }

        function deleteVideo(index) {
            if (confirm('Xóa video này?')) {
                videos.splice(index, 1);
                saveData(); renderVideoList(); loadVideos();
                showToast('Đã xóa video!');
            }
        }

        // ========== HIỂN THỊ VIDEO ==========
        function loadVideos() {
            const grid = document.getElementById('videoGrid');
            grid.innerHTML = '';
            videos.forEach(video => {
                const card = document.createElement('div');
                card.className = 'video-card';
                
                const videoTag = video.url && video.url !== '#' 
                    ? `<video controls style="width:100%; max-height:200px; border-radius:8px; margin-bottom:10px; background:#000;">
                        <source src="${video.url}" type="video/mp4">
                        Trình duyệt không hỗ trợ.
                       </video>`
                    : `<div style="width:100%;height:120px;border-radius:8px;background:#111;display:flex;align-items:center;justify-content:center;margin-bottom:10px;">🎬</div>`;

                card.innerHTML = `
                    ${videoTag}
                    <div class="video-title">${video.title}</div>
                    <div class="video-desc">${video.description}</div>
                    <div style="margin-top:10px;">
                        <button class="btn-submit" style="padding:8px;font-size:14px;" onclick="watchVideo('${video.url}')">▶️ Xem & Tải</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function watchVideo(url) {
            window.open(url, '_blank');
        }

        // ========== TOAST ==========
        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast show' + (isError ? ' error' : '');
            setTimeout(() => { toast.className = 'toast'; }, 3000);
        }

        window.onload = function() {
            saveData();
            loadVideos();
        };
    </script>
</body>
</html>
